name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Node ${{ matrix.node-version }} Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

  self-consumption:
    name: Generate + Lint a Real Scaffold (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    # GitHub's Windows runners ship Git Bash; pinning bash keeps the POSIX
    # steps below identical across all three OSes. windows-latest matters
    # here because npm installs the bin as a .cmd shim there, not a symlink —
    # a different code path in index.js's main-guard.
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
          coverage: none

      # Pack + global-install the real tarball instead of running `node index.js`
      # directly. npm/npx put a *symlink* to index.js on the PATH on macOS/Linux
      # (unlike Windows, which generates a shim script) — that's the exact install
      # shape that silently broke the CLI's main-guard before v1.0.2, and running
      # the source file directly would never have caught it.
      - name: Pack the CLI
        run: npm pack

      - name: Install the packed CLI globally (real bin, not `node index.js`)
        run: |
          mkdir -p "$HOME/npm-global"
          npm install -g --prefix "$HOME/npm-global" ./create-wp-plugin-cli-*.tgz
          # POSIX puts the bin shim in <prefix>/bin; Windows puts the .cmd
          # shim directly in <prefix>. Add both — whichever exists wins.
          echo "$HOME/npm-global/bin" >> "$GITHUB_PATH"
          echo "$HOME/npm-global" >> "$GITHUB_PATH"

      - name: Generate a real scaffold via the installed bin (all modules + React)
        run: |
          create-wp-plugin-cli -y \
            --name "Self Consumption Test" \
            --slug self-consumption-test \
            --namespace SelfConsumptionTest \
            --prefix sctp \
            --author "CI" \
            --email ci@example.com \
            --description "Self-consumption CI check" \
            --modules "admin_settings,shortcode,rest_api,ajax_handler,cpt_taxonomy,cron,caching,custom_table,elementor_widget,block,woocommerce_hooks,interactivity,cli,editor_config,integration_tests" \
            --react \
            --out "$RUNNER_TEMP/generated-plugin"

      - name: Verify the scaffold was actually generated
        run: |
          if [ ! -f "$RUNNER_TEMP/generated-plugin/self-consumption-test.php" ]; then
            echo "::error::No plugin file was generated — main() likely never ran (symlink main-guard regression). See index.js's isRunAsScript()."
            exit 1
          fi

      - name: composer validate --strict
        working-directory: ${{ runner.temp }}/generated-plugin
        run: composer validate --strict

      - name: composer install
        working-directory: ${{ runner.temp }}/generated-plugin
        # Retry a few times: composer install can fail transiently (a network
        # blip against packagist, or a runner-side file-lock hiccup mid-extraction).
        run: |
          n=0
          until composer install --no-interaction --prefer-dist --no-progress; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then
              echo "composer install failed after 3 attempts" >&2
              exit 1
            fi
            echo "composer install failed (attempt $n/3) — retrying in 5s..."
            sleep 5
          done

      - name: composer lint
        working-directory: ${{ runner.temp }}/generated-plugin
        run: composer lint

      - name: composer test
        working-directory: ${{ runner.temp }}/generated-plugin
        run: composer test

      - name: npm install + build + lint + JS unit tests
        working-directory: ${{ runner.temp }}/generated-plugin
        run: |
          npm install
          npm run lint:js
          npm run lint:style
          npm run build
          npm run test:js

  verify:
    name: Verify Fixture Spread (npm run verify)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
          coverage: none

      - name: Install Dependencies
        run: npm ci

      # scripts/verify.js scaffolds minimal / elementor / woo / vip / full
      # fixtures and runs php -l + composer lint + composer test + a
      # leftover-token scan on each. The single scaffold in self-consumption
      # above exercises the *packaged bin*; this exercises the *module matrix*.
      - name: Run verification
        run: npm run verify
